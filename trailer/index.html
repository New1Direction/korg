<html lang="en">
<head>

<style>

<body>
<div id="stage"><canvas id="c" width="1280" height="720"></canvas></div>
<div id="ui"><button id="play">▶ PLAY TRAILER (SOUND ON)</button></div>
<div id="bar"></div>
<audio id="aud" src="out/korg-trailer.wav" preload="auto"></audio>
<script>
"use strict";
/* ============================================================================
   KORG — launch trailer. One deterministic function: render(t) draws any frame
   of the 60 s film. `node trailer/render.mjs` steps t and encodes the video;
   opening this file in a browser plays it live.

   Query: ?t=12.5  static frame      ?captions=0  hide voiceover captions
          ?capture=1  headless mode (used by render.mjs)
   Everything on screen that looks like data is real: the six hashes are the
   entry_hash values of spec/korg-ledger-v1/web/samples/session.jsonl, the
   code texture is crates/korg-ledger/src/lib.rs, and the story is the real
   `korg demo` (seq 390-393: wrong edit, failed pytest, rewind to 391, fix).
   ========================================================================== */
const Q = new URLSearchParams(location.search);
const W = 1280, H = 720, DUR = 60;
const CAPTIONS = Q.get("captions") !== "0";
const CAPTURE = Q.get("capture") === "1";

const SANS = '"Helvetica Neue",Helvetica,Arial,"Liberation Sans","DejaVu Sans",sans-serif';
const MONO = '"JetBrains Mono","DejaVu Sans Mono","Liberation Mono",monospace';
const CY = "#58e6ff", RED = "#ff3d55", GRN = "#46f0a0", VIO = "#a98bff", AMB = "#ffb84d", WHT = "#ffffff";

/* real ledger hashes (entry_hash, seq 1-6 of the sample session) */
const HASH = [
  "ef97aa2895f40c9b40253fc69899390aaa4d0e4dc4fb9342f4d8523628eaf0e6",
  "8e09a6740d27a5c6d99ce58b2864d22e2b2503423a819096b5865633d73824a0",
  "b1ddfc5d2d6102ceeeea3e4bd62fc2d5378df0516cabf664327b907f4e136359",
  "0d832ce43ca6e12a6b617422a2ff5e28148f0b7a84c8e846d5ff394009de813f",
  "b88d55c72b36ac91f1315c765f34bdcd4a8d70c85bbaadea1216ab6b23ec5ac3",
  "a53eeeb57870e8ec8293128cada369d22a0d853392117ef834d5de5d63f38739",
];
/* real verifier source (crates/korg-ledger/src/lib.rs) used as texture */
const CODE = [
  "let stored = e.get(\"entry_hash\").and_then(|v| v.as_str());",
  "let prev = e.get(\"prev_hash\").and_then(|v| v.as_str()).unwrap_or(\"\");",
  "if prev != expected_prev {",
  "    errors.push(format!(\"seq {sid}: prev_hash breaks the chain \\",
  "         (an event was inserted, deleted, or reordered)\"));",
  "}",
  "if let Some(msg) = canon_domain_error(e) {",
  "    errors.push(format!(\"seq {sid}: {msg}\"));",
  "}",
  "if chain_hash(e, key) != stored {",
  "    errors.push(format!(\"seq {sid}: entry_hash mismatch (content was tampered)\"));",
  "}",
  "expected_prev = stored.to_string();",
];

/* ------------------------------------------------------------------ utils */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eOut = (t, p = 3) => 1 - Math.pow(1 - clamp(t), p);
const eIn = (t, p = 3) => Math.pow(clamp(t), p);

const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const hex = (n, len) => { let s = ""; for (let i = 0; i < len; i++) s += "0123456789abcdef"[Math.floor(hash1(n * 131 + i * 7 + 3) * 16)]; return s; };
const rgba = (hexc, a) => { const n = parseInt(hexc.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

function text(c, s, x, y, o = {}) {
  const { size = 40, weight = 800, color = WHT, align = "center", font = SANS, ls = 0, alpha = 1, base = "middle" } = o;
  c.save(); c.globalAlpha *= alpha; c.font = `${weight} ${size}px ${font}`; c.letterSpacing = ls + "px";
  c.textAlign = align; c.textBaseline = base; c.fillStyle = color;
  c.fillText(s, align === "center" ? x + ls / 2 : x, y); c.restore();
}
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function chroma(c, s, x, y, o, d) {            // RGB-split text
  c.save(); c.globalCompositeOperation = "lighter";
  text(c, s, x - d, y, { ...o, color: "#ff0000" }); text(c, s, x, y, { ...o, color: "#00ff00" }); text(c, s, x + d, y, { ...o, color: "#0000ff" });
  c.restore();
}
function typed(s, t0, cps, t) { return s.slice(0, Math.max(0, Math.min(s.length, Math.floor((t - t0) * cps)))); }
const fadeIO = (t, a, b, c, d) => sstep(a, b, t) * (1 - sstep(c, d, t));

/* ------------------------------------------------------------- sprites */
const SPR = {};
for (const [k, col] of Object.entries({ cy: CY, red: RED, grn: GRN, vio: VIO, amb: AMB, wht: "#cfe9ff", gh: "#5a6a78" })) {
  const c = mk(64, 64), x = c.getContext("2d"), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(.18, rgba(col.length === 7 ? col : CY, .95));
  g.addColorStop(.45, rgba(col, .28)); g.addColorStop(1, rgba(col, 0));
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); SPR[k] = c;
}

/* ---------------------------------------------------- baked overlay layers */
const VIG = mk(W, H); { const x = VIG.getContext("2d"), g = x.createRadialGradient(W / 2, H / 2, H * .38, W / 2, H / 2, H * .95); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.78)"); x.fillStyle = g; x.fillRect(0, 0, W, H); }
const SCAN = mk(W, H); { const x = SCAN.getContext("2d"); x.fillStyle = "rgba(0,0,0,.18)"; for (let y = 0; y < H; y += 3) x.fillRect(0, y, W, 1); }
const GRAIN = mk(256, 256); { const x = GRAIN.getContext("2d"), d = x.createImageData(256, 256); for (let i = 0; i < 256 * 256; i++) { const v = hash1(i * 3 + 11) * 255; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 255; } x.putImageData(d, 0, 0); }

/* ===================================================================== core */
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const SC = mk(W, H), c = SC.getContext("2d");          // scene buffer; every scene draws into `c`
let FX;

function tintCopy(dst, src, col) { const x = dst.getContext("2d"); x.globalCompositeOperation = "copy"; x.drawImage(src, 0, 0); x.globalCompositeOperation = "multiply"; x.fillStyle = col; x.fillRect(0, 0, W, H); x.globalCompositeOperation = "source-over"; }

function composite(t, fx) {

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (fx.shake) ctx.translate((hash1(seed * 3) - .5) * fx.shake, (hash1(seed * 5 + 1) - .5) * fx.shake);
  if (fx.glitch > 0) {
    ctx.drawImage(SC, 0, 0);
    let y = 0, k = 0;
    while (y < H) {
      const h = 4 + Math.floor(hash1(seed * 17 + k * 3) * 46); k++;
      if (hash1(seed * 31 + k * 7) < fx.glitch) {
        const dx = (hash1(seed * 13 + k * 5) - .5) * 260 * fx.glitch;
        ctx.drawImage(SC, 0, y, W, h, dx, y, W, h);
      }
      y += h;
    }
  } else ctx.drawImage(SC, 0, 0);
  if (fx.chroma > 0) {
    const d = fx.chroma;
    tintCopy(TR, SC, "#ff0000"); tintCopy(TB, SC, "#0000ff");
    ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = .55;
    ctx.drawImage(TR, -d, 0); ctx.drawImage(TB, d, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }
  ctx.restore();
  if (fx.vig !== 0) { ctx.globalAlpha = fx.vig; ctx.drawImage(VIG, 0, 0); ctx.globalAlpha = 1; }
  ctx.globalAlpha = fx.scan; ctx.drawImage(SCAN, 0, 0); ctx.globalAlpha = 1;
  if (fx.grain > 0) {
    ctx.save(); ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = fx.grain;
    const ox = Math.floor(hash1(seed * 7) * 256), oy = Math.floor(hash1(seed * 9 + 2) * 256);
    for (let y = -256 + oy; y < H; y += 256) for (let x = -256 + ox; x < W; x += 256) ctx.drawImage(GRAIN, x, y);
    ctx.restore();
  }
  if (fx.flash > 0.002) { ctx.globalAlpha = clamp(fx.flash); ctx.fillStyle = fx.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (fx.fade < 1) { ctx.globalAlpha = 1 - fx.fade; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

/* ============================================================== 3D field */
const GN = [], GE = [];
(function buildGraph() {
  const rnd = rng(1337), S = 40, SEQ0 = 284, TRUNK_N = 150;
  const nd = (x, y, z, k, ex = {}) => { const n = { x, y, z, k, i: GN.length, r: 2.6, tb: -1, ...ex }; GN.push(n); return n; };
  const ed = (a, b, k) => GE.push({ a: a.i, b: b.i, k });
  const trunk = [];
  for (let i = 0; i <= TRUNK_N; i++) {
    const n = nd(Math.sin(i * .31) * 28 + Math.sin(i * .07) * 60, Math.cos(i * .23) * 18, i * S, "trunk", { r: 5, idx: i, seq: i + SEQ0, tb: i });
    if (i === 107) { n.k = "read"; n.r = 9; } if (i === 108) { n.k = "edit"; n.r = 8; } if (i === 109) { n.k = "exec"; n.r = 8; }
    if (i === 110) { n.k = "err"; n.r = 12; } if (i === 111) { n.k = "state"; n.r = 8; }
    trunk.push(n); if (i) ed(trunk[i - 1], n, "trunk");
  }
  function grow(from, ang, len, depth, tb, scaleRad, kindTail) {
    let prev = from, x = from.x, y = from.y, z = from.z, a = ang;
    for (let k = 1; k <= len; k++) {
      const rad = (14 + rnd() * 24) * scaleRad;
      a += (rnd() - .5) * .38; x += Math.cos(a) * rad; y += Math.sin(a) * rad * .8; z += 20 + rnd() * 26;
      const last = k === len; let kind = "branch";
      if (last) { const q = rnd(); kind = q < .30 ? "ok" : q < .52 ? "bad" : "branch"; }
      const n = nd(x, y, z, kind, { tb, depth, r: last && kind !== "branch" ? 4 : 2.4 }); ed(prev, n, "branch"); prev = n;
      if (depth < 3 && k > 2 && !last && rnd() < .2) grow(n, a + (rnd() < .5 ? -1 : 1) * (.6 + rnd() * .9), Math.max(3, Math.floor(len * .55)), depth + 1, tb, scaleRad, kindTail);
    }
  }
  for (let i = 2; i < TRUNK_N - 2; i++) {

    const scaleRad = .8 + i / 45, nb = (rnd() < .78 ? 1 : 0) + (rnd() < .3 ? 1 : 0);
    for (let b = 0; b < nb; b++) grow(trunk[i], rnd() * Math.PI * 2, 5 + Math.floor(rnd() * 14), 1, i, scaleRad);
  }
  /* the alternate future: branch off seq 391 (trunk idx 107) */
  const t0 = trunk[107];
  const A1 = nd(t0.x + 70, t0.y + 55, t0.z + 40, "new", { r: 8, seq: 392, alt: 1 });
  const A2 = nd(t0.x + 150, t0.y + 100, t0.z + 88, "new", { r: 8, seq: 393, alt: 2 });
  const A3 = nd(t0.x + 245, t0.y + 138, t0.z + 138, "pass", { r: 11, seq: 394, alt: 3 });
  ed(t0, A1, "new"); ed(A1, A2, "new"); ed(A2, A3, "new");
  let prev = A3, a = .95, x = A3.x, y = A3.y, z = A3.z;
  const newFuture = [A3];
  for (let k = 0; k < 26; k++) {
    a += (rnd() - .5) * .25; x += Math.cos(a) * 36; y += Math.sin(a) * 26; z += 44;
    const n = nd(x, y, z, "newf", { r: 3.6, alt: 4 + k, seq: 395 + k }); ed(prev, n, "new"); prev = n; newFuture.push(n);

})();

function lookAt(cam, tx, ty, tz) {
  const dx = tx - cam.x, dy = ty - cam.y, dz = tz - cam.z;
  cam.yaw = Math.atan2(dx, dz);
  const z1 = dx * Math.sin(cam.yaw) + dz * Math.cos(cam.yaw);
  cam.pitch = Math.atan2(dy, z1);
  return cam;
}
function project(cam, x, y, z, o) {

  const y1 = dy * cp - z1 * sp, z2 = dy * sp + z1 * cp;
  if (z2 < 8) return false;
  const s = cam.f / z2; let px = x1 * s, py = y1 * s;
  if (cam.roll) { const cr = Math.cos(cam.roll), sr = Math.sin(cam.roll); const rx = px * cr - py * sr, ry = px * sr + py * cr; px = rx; py = ry; }
  o.x = W / 2 + px; o.y = H / 2 - py; o.s = s; o.d = z2; return true;
}
const NCOL = { trunk: "cy", branch: "cy", read: "wht", edit: "cy", exec: "cy", err: "red", state: "amb", ok: "grn", bad: "red", new: "vio", pass: "grn", newf: "vio" };
const ECOL = { trunk: CY, branch: "#2a86c8", new: VIO, bad: RED };
const PA = GN.map(() => ({ x: 0, y: 0, s: 0, d: 0, ok: false, a: 1, spr: "cy", r: 3 }));

/* o: { t, vis(n)->alpha, spr(n)->key, fog, nodeScale, edgeAlpha, lineCol(e)->hex } */
function drawField(cam, o) {
  const fog = o.fog || 4200, ns = o.nodeScale || 1, ea = o.edgeAlpha == null ? .5 : o.edgeAlpha;
  for (let i = 0; i < GN.length; i++) {
    const n = GN[i], p = PA[i];

/* ================================================================ scene A  */
let GP = null, KP = null, TG = null;
function sampleText(str, size, ls, step) {
  const m = mk(W, H), x = m.getContext("2d"); x.fillStyle = "#fff"; x.font = `900 ${size}px ${SANS}`; x.letterSpacing = ls + "px";
  x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(str, W / 2 + ls / 2, H / 2);

function sceneA(t, fx) {
  if (!GP) initParticles();

  /* GRONK: the familiar logo, then it breaks */
  if (t < 3.8) {
    const so = { size: 200, ls: 18 };
    const appear = sstep(.45, .9, t);
    const dist = sstep(1.55, 2.2, t);                    // distortion builds
    const breakK = sstep(2.2, 2.38, t);

      c.save(); c.globalAlpha = appear * (1 - breakK);
      text(c, "GRONK", cx + Math.sin(t * 40) * dist * 5, cy, { ...so, color: "#f2f2f2" });

      text(c, HASH[i % 6].slice(0, 10), 400, y, { size: 15, weight: 500, font: MONO, align: "left", color: hot ? "#cfe9ff" : "#3d566b" });
    }
    rr(c, 620, 70, 600, 420, 8); c.fillStyle = "rgba(6,12,18,.9)"; c.fill(); c.strokeStyle = rgba(CY, .35); c.stroke();
    text(c, "$ korg replay --to seq " + (385 + sc + 4), 644, 110, { size: 17, weight: 600, font: MONO, align: "left", color: GRN });
    ["def subtract(a, b):", "    return a - b"].forEach((l, i) => text(c, typed(l, 43 + cut + .1 + i * .3, 60, t), 644, 170 + i * 36, { size: 22, weight: 500, font: MONO, align: "left", color: "#cdd9e5" }));
    text(c, "state @ seq " + (385 + sc + 4) + "  ·  tree " + hex(sc, 8), 644, 450, { size: 15, weight: 500, font: MONO, align: "left", color: AMB });
    c.fillStyle = "#13202c"; c.fillRect(60, 540, W - 120, 6); c.fillStyle = CY; c.fillRect(60, 540, (W - 120) * lt, 6); c.beginPath(); c.arc(60 + (W - 120) * lt, 543, 11, 0, 6.2832); c.fill();
    c.fillStyle = g; c.fillRect(0, H - 260, W, 260); superWord("REPLAY", 60, H - 90, 44, t);
  } else if (cut === 2) {                // verify
    codeTexture(t, .5, true);
    const bw = 170, gap = 38, x0 = (W - (6 * bw + 5 * gap)) / 2;
    for (let i = 0; i < 6; i++) {
      const x = x0 + i * (bw + gap), okT = .12 + i * .1, ok = lt > okT, kk = eOut((lt - okT) * 6);
      rr(c, x, 230, bw, 150, 8); c.fillStyle = "rgba(6,12,18,.92)"; c.fill(); c.strokeStyle = rgba(ok ? GRN : CY, ok ? .9 : .35); c.lineWidth = 2; c.stroke();
      text(c, "seq " + (i + 1), x + 14, 252, { size: 14, weight: 600, font: MONO, align: "left", color: CY });
      text(c, ["prompt", "llm", "Read", "Edit", "Bash", "llm"][i], x + 14, 282, { size: 20, weight: 700, font: MONO, align: "left", color: WHT });
      text(c, HASH[i].slice(0, 12), x + 14, 322, { size: 13, weight: 500, font: MONO, align: "left", color: "#7f98ad" });
      text(c, HASH[(i + 5) % 6].slice(0, 12), x + 14, 346, { size: 13, weight: 500, font: MONO, align: "left", color: "#46606f" });
      if (ok) text(c, "✓", x + bw - 26, 254, { size: 26, weight: 800, color: GRN, alpha: kk });
      if (i < 5) { c.strokeStyle = rgba(ok ? GRN : CY, .8); c.lineWidth = 3; c.beginPath(); c.moveTo(x + bw, 305); c.lineTo(x + bw + gap, 305); c.stroke(); }
    }
    text(c, typed("✓ journal VALID — 6 events, hash-chain + DAG intact", 45.55, 60, t), W / 2, 450, { size: 24, weight: 700, font: MONO, color: GRN });
    c.fillStyle = g; c.fillRect(0, H - 260, W, 260); superWord("VERIFY", 60, H - 90, 45, t);
  } else if (cut === 3) {                // agent session — three vendors, one format
    codeTexture(t, .2, false);
    const lanes = [["agent:claude-code", CY], ["codex-cli · websocket", AMB], ["grok-heavy · ×16", VIO]];
    lanes.forEach(([nm, col], l) => {
      const y = 190 + l * 130; text(c, nm, 60, y - 34, { size: 15, weight: 600, font: MONO, align: "left", color: col, ls: 3 });
      c.strokeStyle = rgba(col, .25); c.lineWidth = 2; c.beginPath(); c.moveTo(60, y); c.lineTo(W - 340, y); c.stroke();
      for (let k = 0; k < 14; k++) { const f = ((lt * .9 + k / 14 + l * .13) % 1), x = 60 + f * (W - 400), ty = lerp(y, 355, sstep(.55, 1, f)); c.fillStyle = rgba(col, .9); c.fillRect(x, ty - 6, 22, 12); }
    });
    rr(c, W - 330, 300, 270, 110, 8); c.fillStyle = "rgba(6,12,18,.92)"; c.fill(); c.strokeStyle = rgba(GRN, .7); c.lineWidth = 2; c.stroke();
    text(c, "korg-ledger@v1", W - 195, 340, { size: 22, weight: 700, font: MONO, color: GRN }); text(c, "one verifier", W - 195, 376, { size: 16, weight: 500, font: MONO, color: "#8fa3b6", ls: 4 });
    text(c, "AGENT SESSION", 60, H - 60, { size: 22, weight: 600, font: MONO, align: "left", color: CY, ls: 8 });
  } else if (cut === 4) {                // state reconstruction / rewind
    codeTexture(t, .25, false);
    const sq = Math.round(lerp(393, 391, eOut(lt * 1.4)));
    text(c, typed("[korg] Restoring workspace snapshot via git read-tree (O(1))…", 47.05, 50, t), 60, 80, { size: 20, weight: 500, font: MONO, align: "left", color: "#9fb2c4" });
    text(c, "SEQ " + sq, W - 60, 80, { size: 42, weight: 800, font: MONO, align: "right", color: WHT });
    rr(c, 60, 130, 760, 320, 8); c.fillStyle = "rgba(6,12,18,.92)"; c.fill(); c.strokeStyle = rgba(CY, .35); c.stroke();
    ["def add(a, b):", "    return a + b", "", "def subtract(a, b):", "    # Intended bug", "    return a + b"].forEach((l, i) => text(c, typed(l, 47.1 + i * .1, 70, t), 90, 175 + i * 44, { size: 26, weight: 500, font: MONO, align: "left", color: i === 4 ? "#6e7681" : "#cdd9e5" }));
    for (let i = 0; i < 3; i++) { const y = 150 + i * 120; rr(c, 870, y, 350, 90, 8); c.fillStyle = "rgba(6,12,18,.9)"; c.fill(); c.strokeStyle = rgba(i === 2 ? GRN : CY, .5); c.stroke(); text(c, ["seq 393 ✗ undone", "seq 392 ✗ undone", "seq 391 ✓ restored"][i], 890, y + 34, { size: 18, weight: 600, font: MONO, align: "left", color: [RED, RED, GRN][i], alpha: lt > .2 + i * .22 ? 1 : .25 }); text(c, hex(i + 70, 14), 890, y + 64, { size: 13, weight: 500, font: MONO, align: "left", color: "#46606f" }); }
    c.fillStyle = g; c.fillRect(0, H - 260, W, 260); superWord("REWIND", 60, H - 90, 47, t);
  } else {                               // branching timeline
    codeTexture(t, .2, false);
    const y0 = 360, gx = (f) => 80 + f * (W - 160), grow = eOut(lt * 1.3);
    c.strokeStyle = rgba(CY, .9); c.lineWidth = 3; c.beginPath(); c.moveTo(gx(0), y0); c.lineTo(gx(.5 * Math.min(1, grow * 2)), y0); c.stroke();
    const forks = [[.2, -1, GRN, "b1"], [.34, 1, RED, "b2 ✗"], [.5, -1, VIO, "b3"], [.5, 1, GRN, "b4"], [.62, -1, GRN, "b5"], [.72, 1, VIO, "b6"]];
    forks.forEach(([f, dir, col, nm], i) => {
      const a = clamp((grow - i * .1) * 2.2); if (a <= 0) return;
      const x1 = gx(f), x2 = gx(f + .24 * a), y2 = y0 + dir * (90 + (i % 3) * 36) * a;
      c.strokeStyle = rgba(col, .9); c.lineWidth = 3; c.beginPath(); c.moveTo(x1, y0); c.bezierCurveTo(x1 + 60, y0, x1 + 60, y2, x2, y2); c.stroke();
      c.drawImage(SPR[col === RED ? "red" : col === GRN ? "grn" : "vio"], x2 - 20, y2 - 20, 40, 40);
      text(c, nm, x2 + 14, y2 + (dir < 0 ? -22 : 24), { size: 16, weight: 600, font: MONO, align: "left", color: col, alpha: a });
    });
    c.drawImage(SPR.cy, gx(0) - 16, y0 - 16, 32, 32);
    c.fillStyle = g; c.fillRect(0, H - 260, W, 260); superWord("BRANCH", 60, H - 90, 48, t);
  }
  if (t >= 49.0) {                       // the four verbs
    c.fillStyle = "#000"; c.fillRect(0, 0, W, H);
    const words = ["REPLAY", "VERIFY", "REWIND", "BRANCH"], cols = [CY, GRN, AMB, VIO];
    words.forEach((w, i) => {
      const k = t - (49.0 + i * .2); if (k < 0) return;
      const y = 150 + i * 135;
      chroma(c, w, W / 2, y, { size: 108, ls: 34, alpha: 1 }, 9 * Math.exp(-k * 10));
      c.fillStyle = rgba(cols[i], .85); c.fillRect(W / 2 - 330, y + 66, 660 * eOut(k * 4), 3);
    });
    fx.flash = Math.max(fx.flash, .07 * Math.exp(-((t - 49) % .2) * 30)); fx.chroma = 0; fx.glitch = 0;
  }
}

/* ================================================================ scene H  */
function fit(s, size, ls, maxW) { c.font = `800 ${size}px ${SANS}`; c.letterSpacing = ls + "px"; const w = c.measureText(s).width; return w > maxW ? size * maxW / w : size; }
function sceneH(t, fx) {
  fx.vig = .5; fx.grain = .04;
  const l1 = fadeIO(t, 50.65, 51.2, 52.15, 52.45);
  if (l1 > 0) { const k = eOut((t - 50.65) / 1.4), ls = lerp(30, 9, k), sz = fit("AI CAN MAKE MISTAKES.", 74, 9, 1120); text(c, "AI CAN MAKE MISTAKES.", W / 2, H / 2, { size: sz, ls, alpha: l1 }); }
  const l2 = sstep(53.0, 53.6, t) * (1 - sstep(55.7, 56.0, t));
  if (l2 > 0) {
    const k = eOut((t - 53.0) / 1.5), ls = lerp(24, 8, k), sz = fit("AI DOESN'T HAVE TO", 82, 9, 1000);
    text(c, "AI DOESN'T HAVE TO", W / 2, H / 2 - 62, { size: sz, ls, alpha: l2 });
    const f = sstep(54.0, 54.6, t);
    c.save(); c.globalAlpha = l2 * sstep(53.5, 54.0, t);
    text(c, "FORGET THEM.", W / 2, H / 2 + 62, { size: sz, ls, color: f > 0 ? "#bff4ff" : WHT });
    if (f > 0) { c.globalAlpha = l2 * f * .35; c.drawImage(SPR.cy, W / 2 - 330, H / 2 - 40, 660, 200); }
    c.restore();
  }
}

/* ================================================================ scene I  */
function sceneI(t, fx) {
  fx.vig = .55; fx.grain = .035;
  const k = t - 56.0, cx = W / 2, cy = H / 2 - 50;
  if (t < 58.4) {
    const a = sstep(56.0, 57.6, t), ls = lerp(70, 26, eOut(k / 2.4)), so = { size: 200, ls, alpha: a };
    c.save(); c.globalAlpha = 1; text(c, "KORG", cx, cy, so);
    c.globalAlpha = a * .22; c.drawImage(SPR.cy, cx - 420, cy - 150, 840, 300); c.restore();
    text(c, typed("A MEMORY AND VERIFICATION LAYER FOR AI AGENTS.", 57.0, 24, t), cx, cy + 150, { size: 20, weight: 500, font: MONO, ls: 7, color: "#9fb2c4" });
    if (t > 58.1) { c.fillStyle = "#000"; c.globalAlpha = sstep(58.1, 58.4, t); c.fillRect(0, 0, W, H); c.globalAlpha = 1; }
  } else if (t < 59.72) {
    const f = t - 58.4;
    chroma(c, "REPO.ING", cx, cy, { size: 150, ls: 22, alpha: sstep(58.4, 58.55, t) }, 10 * Math.exp(-f * 10));
    text(c, typed("DON'T JUST STAR IT. BACK IT.", 58.6, 28, t), cx, cy + 130, { size: 32, weight: 600, font: MONO, ls: 8, color: "#cfe9ff" });
    fx.flash = Math.max(fx.flash, .3 * Math.exp(-f * 14));
  }
  if (t >= 59.72) { c.fillStyle = "#000"; c.fillRect(0, 0, W, H); }
}

/* ============================================================== captions  */
const CAPS = [
  [13.0, 15.1, "AI agents are going to make mistakes."], [15.65, 16.55, "The problem is…"], [16.95, 18.0, "…what happens next?"],
  [19.2, 22.8, "What if you could see exactly what happened?"],
  [36.7, 38.7, "Don't just know what an agent did."], [39.3, 40.9, "Know why it happened."], [41.45, 43.0, "And change what happens next."],
];
function captions(t) {
  if (!CAPTIONS) return;
  for (const [a, b, s] of CAPS) {
    const al = fadeIO(t, a, a + .22, b - .2, b); if (al <= 0) continue;
    ctx.save(); ctx.globalAlpha = al; ctx.font = `500 30px ${SANS}`; ctx.letterSpacing = "1px"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 14; ctx.fillStyle = "#e9f3fb"; ctx.fillText(s, W / 2, H - 78); ctx.restore();
  }
}

/* ================================================================= render  */
function render(t) {
  t = clamp(t, 0, DUR - .001);
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = "source-over"; c.letterSpacing = "0px";
  c.fillStyle = "#000"; c.fillRect(0, 0, W, H);
  const fx = { glitch: 0, chroma: 0, shake: 0, flash: 0, flashColor: "#fff", fade: 1, vig: .7, scan: .35, grain: .07 };
  if (t < 6) sceneA(t, fx);
  else if (t < 12) sceneB(t, fx);
  else if (t < 18) sceneC(t, fx);
  else if (t < 26) sceneD(t, fx);
  else if (t < 34) sceneE(t, fx);
  else if (t < 43) sceneF(t, fx);
  else if (t < 50) sceneG(t, fx);
  else if (t < 56) sceneH(t, fx);
  else sceneI(t, fx);
  if (t >= 11.0 && t < 12.0) fx.grain = .03;
  composite(t, fx);
  captions(t);
}
window.renderAt = (t) => { render(t); return true; };
window.DUR = DUR;

/* ============================================================== playback   */
const $ = (id) => document.getElementById(id);
if (Q.has("t")) { render(parseFloat(Q.get("t"))); $("ui").style.display = "none"; }
else if (CAPTURE) { $("ui").style.display = "none"; render(0); }
else {
  render(0);
  const a = $("aud"); let t0 = 0, playing = false;
  const tick = () => { if (!playing) return; const t = a.readyState > 2 && !a.paused ? a.currentTime : (performance.now() - t0) / 1000; render(t); $("bar").style.width = (t / DUR * 100) + "%"; if (t < DUR) requestAnimationFrame(tick); else { playing = false; $("ui").style.display = "flex"; $("play").textContent = "↻ REPLAY TRAILER"; } };
  $("play").onclick = () => { $("ui").style.display = "none"; playing = true; t0 = performance.now(); a.currentTime = 0; a.play().catch(() => {}); requestAnimationFrame(tick); };
}
</script>
